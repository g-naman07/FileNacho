[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts = -v --tb=short --html=report.html --self-contained-html

markers =
    resilience: Tests for network resilience under lossy conditions
    network: Tests using CDP network conditions emulation
    connectivity: Tests evaluating socket and WebRTC peer connectivity
    bandwidth: Tests evaluating adaptive bandwidth throttling
    offline: Tests simulating transient offline network drops
    integrity: End-to-end data integrity validation tests
